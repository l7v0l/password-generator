<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مولّد كلمات السر</title>
  <meta name="description" content="مولّد كلمات سر آمن يعمل بالكامل داخل متصفحك. لا يُرسل ولا يُحفظ أي شيء.">
  <meta name="theme-color" content="#0b0f1a" id="tc">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b0f1a'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle'%3E%F0%9F%94%90%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Fira+Code:wght@500;600&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>

  <main class="wrap">
    <header class="top">
      <h1><span aria-hidden="true">🔐</span> مولّد كلمات السر</h1>
      <button id="theme" class="theme" aria-label="تبديل الوضع الفاتح والداكن" title="تبديل الوضع">
        <svg class="moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <p class="sub">يتم التوليد داخل متصفحك بمصدر عشوائي مشفّر. لا يُرسل ولا يُحفظ أي شيء.</p>
    </header>

    <div class="grid">
      <section class="card out" aria-label="كلمة السر">
        <output id="pw" class="pw" dir="ltr" aria-live="polite"></output>
        <div class="row-actions">
          <button id="copy" class="btn primary">نسخ</button>
          <button id="regen" class="btn ghost" aria-label="توليد كلمة جديدة"><span>جديد</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
        </div>
        <div class="meter" aria-hidden="true"><i id="bar"></i></div>
        <div class="info"><span id="strength"></span><span id="entropy"></span></div>
        <p class="hint">اضغط مسطرة المسافة لتوليد كلمة جديدة</p>
      </section>

      <section class="card opts" aria-label="الخيارات">
        <div class="len">
          <label for="len">الطول: <b id="lenv">20</b></label>
          <input id="len" type="range" min="6" max="64" value="20">
        </div>

        <div class="toggles">
          <label class="tg"><input type="checkbox" id="lower" checked><span dir="ltr">abc</span><em>أحرف صغيرة</em></label>
          <label class="tg"><input type="checkbox" id="upper" checked><span dir="ltr">ABC</span><em>أحرف كبيرة</em></label>
          <label class="tg"><input type="checkbox" id="digits" checked><span dir="ltr">123</span><em>أرقام</em></label>
          <label class="tg"><input type="checkbox" id="symbols" checked><span dir="ltr">#$&amp;</span><em>رموز</em></label>
        </div>

        <label class="tg wide"><input type="checkbox" id="ambig"><span dir="ltr">1lI0O</span><em>استبعاد الأحرف المتشابهة</em></label>
        <p id="err" class="err" role="alert" hidden>اختر نوع أحرف واحد على الأقل.</p>
      </section>

      <section class="card hist" aria-label="السجل">
        <div class="hh"><h2>الأخيرة (في هذه الجلسة فقط)</h2><button id="clear" class="link">مسح</button></div>
        <ul id="list"></ul>
      </section>
    </div>

    <footer class="foot">
      <span>مفتوح المصدر · يعمل بدون إنترنت · بدون تتبع</span>
    </footer>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
